<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Task List</title>
 <link rel="stylesheet" href="styles/header.css">
 <link rel="stylesheet" href="styles/general.css">
 <link rel="stylesheet" href="styles/task-list/task-view.css">
 <link rel="stylesheet" href="styles/lowerBody.css">
</head>

<body>
 <header>
  <section id="headerBox">
   <div id="hamburger-menu-box">
    <img src="assets/menu-bar.png" alt="hamburger-menu" class="hamburger-menu">
   </div>
   <h1>Task List</h1>
   <div id="appNameBox">
    <img src="assets/app-name-smart.png" alt="Smart" id="appName">
    <p id="floatName">task manager pro</p>
   </div>
  </section>
 </header>
 
 <main>
  <section id="mainBox">
   <!-- filters -->
   <div id="filterRow">
    <button class="filterBtn">All</button>
    <button class="filterBtn">Completed</button>
    <button class="filterBtn">Pending</button>
    <button class="filterBtn">Failed</button>
    <button class="filterBtn">Deleted</button>
   </div>
   
   <!--search box with priority-->
   <div id="searchBox">
    <div id="searchToggle">
     <!-- priority bar -->
     <div id="priorityBox">
      <div class="prior" id="highBtn">
       High
      </div>
      <div class="prior" id="mediumBtn">
       Medium
      </div>
      <div class="prior" id="lowBtn">
       Low
      </div>
     </div>
     <input type="search" placeholder="search">
    </div>
    <img id="searchIcon" src="assets/gifs/find.png" alt="search icon" />
   </div>
   
   
   <div id="scrollBox">
    <section id='taskListDisplay'>
     <section class="priorTabs" id='high'>
      <!-- high prior -->
     </section>
     
     <section class="priorTabs" id='medium'>
       <!-- medium prior -->
     </section>
     <section class="priorTabs" id='low'>
       <!-- low prior -->
     </section>
    </section>
   </div>
   </div>
  </section>
 </main>
 
 
 <footer>
  <section id="menuPile">
   <a href="index.html">
    <div class="pileBox">
     <img class="pileLogo" src="assets/pile/task-edit.png" alt="" />
     <p id="pileText">task view</p>
    </div>
   </a>
   <a href="task-list.html">
    <div class="pileBox">
     <img class="pileLogo" src="assets/pile/task-list.png" alt="" />
     <p id="pileText">task list</p>
    </div>
   </a>
   <a href="settings.html">
    <div class="pileBox">
     <img class="pileLogo" src="assets/pile/settings.png" />
     <p id="pileText">settings</p>
    </div>
   </a>
  </section>
 </footer>

  <div class="overlay">
    
    <div id="inputBox">
      <h1>Edit Task</h1>
      <input type="text">
      <input type="text">
      <input type="date">
      <input type="time">
      <select>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
      <div><button>discard</button>
      <button>save</button></div>
    </div>
    
  </div>

 <script src="scripts/general.js"> </script>
 <script src="scripts/task-list/task-view-animate.js"></script>
 <script src='./scripts/task-list/renderTask.js' type="module"></script>
 </script>
</body>

</html>
